<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>遊戯王カード詳細</title>
  <style>
    body { font-family: sans-serif; background: #1a1a2e; color: #eee; display: flex; justify-content: center; padding: 40px; }
    .card { background: #16213e; border-radius: 12px; padding: 24px; max-width: 420px; width: 100%; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .card img { width: 100%; border-radius: 8px; display: block; }
    .name { font-size: 1.3rem; font-weight: bold; margin: 16px 0 4px; }
    .ruby { font-size: 0.85rem; color: #aaa; margin-bottom: 16px; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat { background: #0f3460; border-radius: 8px; padding: 10px 14px; }
    .stat-label { font-size: 0.75rem; color: #88aacc; margin-bottom: 4px; }
    .stat-value { font-size: 1.1rem; font-weight: bold; }
    .race { grid-column: 1 / -1; }
    #loading { color: #aaa; }
    .search { display: flex; gap: 8px; margin-bottom: 20px; }
    .search input { flex: 1; padding: 10px; border-radius: 8px; border: none; background: #0f3460; color: #eee; font-size: 1rem; }
    .search button { padding: 10px 16px; border-radius: 8px; border: none; background: #e94560; color: #fff; font-size: 1rem; cursor: pointer; }
    .search button:hover { background: #c73652; }
    .duel-link { display: block; text-align: center; margin-top: 16px; color: #88aacc; font-size: 0.9rem; }
    #error { color: #e94560; font-size: 0.9rem; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="search">
      <input id="cid-input" type="text" placeholder="カードID（例: 23160）" value="23160">
      <button onclick="loadCard()">検索</button>
    </div>
    <div id="error"></div>
    <div id="loading" style="display:none">読み込み中...</div>
    <div id="content" style="display:none">
      <img id="img" src="" alt="カード画像">
      <div class="name" id="name"></div>
      <div class="ruby" id="ruby"></div>
      <div class="stats">
        <div class="stat"><div class="stat-label">属性</div><div class="stat-value" id="attribute"></div></div>
        <div class="stat"><div class="stat-label">レベル</div><div class="stat-value" id="level"></div></div>
        <div class="stat"><div class="stat-label">ATK</div><div class="stat-value" id="atk"></div></div>
        <div class="stat"><div class="stat-label">DEF</div><div class="stat-value" id="def"></div></div>
        <div class="stat race"><div class="stat-label">種族</div><div class="stat-value" id="race"></div></div>
      </div>
    </div>
    <a class="duel-link" href="/duel.html">🃏 デュエルシミュレーターへ</a>
  </div>
  <script>
    function loadCard() {
      const cid = document.getElementById('cid-input').value.trim();
      if (!cid) return;
      document.getElementById('error').textContent = '';
      document.getElementById('loading').style.display = 'block';
      document.getElementById('content').style.display = 'none';
      fetch(`/api/card?cid=${cid}`)
        .then(r => r.json())
        .then(d => {
          if (!d.name) throw new Error('カードが見つかりませんでした');
          document.getElementById('img').src = d.imageUrl;
          document.getElementById('name').textContent = d.name;
          document.getElementById('ruby').textContent = d.ruby;
          document.getElementById('attribute').textContent = d.attribute;
          document.getElementById('level').textContent = d.level;
          document.getElementById('atk').textContent = d.atk;
          document.getElementById('def').textContent = d.def;
          document.getElementById('race').textContent = d.race;
          document.getElementById('loading').style.display = 'none';
          document.getElementById('content').style.display = 'block';
        })
        .catch(e => {
          document.getElementById('loading').style.display = 'none';
          document.getElementById('error').textContent = e.message;
        });
    }
    document.getElementById('cid-input').addEventListener('keydown', e => e.key === 'Enter' && loadCard());
    loadCard();
  </script>
</body>
</html>
